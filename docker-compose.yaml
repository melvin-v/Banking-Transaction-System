services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuPassw0rd!Fuerte"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "TuPassw0rd!Fuerte"
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "/db/entrypoint.sh"]
    restart: "no"

  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=mssql,1433;Database=Banca;User Id=sa;Password=TuPassw0rd!Fuerte;TrustServerCertificate=True;Encrypt=True"
    ports:
      - "8080:8080"

volumes:
  mssqldata: